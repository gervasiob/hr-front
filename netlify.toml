[build]
  command = "npm run build"
  publish = "dist"
  environment = { NODE_VERSION = "18", NPM_FLAGS = "--legacy-peer-deps" }

[dev]
  command = "vite"
  port = 5173
  targetPort = 5173
  framework = "vite"

[[redirects]]
  from = "/back/*"
  to = "http://54.226.252.233:8000/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

